<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sport Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="sport">
      <div class="sport-left">
        <p class="tag">SPORT</p>
        <h1>Train hard. Stay strong.</h1>
        <p class="text">
          Best sports gear for running, gym and everyday training.
        </p>

        <div class="buttons">
          <a href="#products" class="btn btn-primary">Shop now</a>
          <a href="#products" class="btn btn-light">Deals</a>
        </div>

        <div class="stats">
          <div>
            <strong>20k+</strong>
            <span>Customers</span>
          </div>
          <div>
            <strong>300+</strong>
            <span>Products</span>
          </div>
          <div>
            <strong>4.9</strong>
            <span>Rating</span>
          </div>
        </div>
      </div>

      <div class="sport-right">
        <img
          src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80"
          alt="Sports gear"
        />
        <div class="product-box">
          <span>Best seller</span>
          <h3>Run X Pro</h3>
          <p>€149</p>
        </div>
      </div>
    </section>

    <section class="products" id="products">
      <h2>Popular products</h2>

      <div class="product-grid">
        <article class="card">
          <img
            src="https://cdn.sportshop.com/catalog/product/1500/1500/1/6/160175_1.jpg"
            alt="Jacket"
          />
          <h3>Training Jacket</h3>
          <p>€89</p>
        </article>

        <article class="card">
          <img
            src="https://th.bing.com/th/id/R.9e97b2e970e9818046c3739bf115e768?rik=NOKvC5aVlOktuQ&pid=ImgRaw&r=0"
            alt="Shoes"
          />
          <h3>Running Shoes</h3>
          <p>€129</p>
        </article>

        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=900&q=80"
            alt="Gym set"
          />
          <h3>Gym Set</h3>
          <p>€199</p>
        </article>
      </div>
    </section>
  </body>
</html>
